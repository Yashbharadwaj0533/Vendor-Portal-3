<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Innoworq</title>
    <style>
        :root {
            --primary: #0d6efd; --primary-dark: #0a58ca;
            --bg: #f8fafc; --card: #ffffff;
            --text: #1e293b; --text-light: #64748b;
            --border: #e2e8f0; --radius: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        
        /* Navbar Styles */
        .navbar { background: white; padding: 1rem 0; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem; }
        .flex-nav { display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { font-weight: 800; color: var(--primary); font-size: 1.4rem; text-decoration: none; }
        
        /* Form Layout */
        .main-content {
            display: flex; align-items: center; justify-content: center; 
            min-height: calc(100vh - 73px); padding: 20px;
        }
        .form-card { 
            background: var(--card); padding: 2.5rem; 
            border-radius: var(--radius); 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
            width: 100%; max-width: 400px; 
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; color: #0f172a; margin-bottom: 0.5rem; }
        
        .form-group { margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.85rem; font-weight: 600; color: #475569; }
        input { 
            padding: 0.75rem; border: 1px solid var(--border); 
            border-radius: 6px; font-size: 0.95rem; 
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,110,253,0.1); }
        
        .btn-submit { 
            background: var(--primary); color: white; border: none; 
            padding: 0.75rem; border-radius: 6px; font-weight: 600; 
            cursor: pointer; width: 100%; transition: 0.2s;
        }
        .btn-submit:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container flex-nav">
            <a href="index.html" class="nav-brand">INNOWORQ</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="form-card">
            <div class="header">
                <h1>Set New Password</h1>
                <p style="font-size: 0.85rem; color: var(--text-light);">Update your account credentials</p>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Update Password</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUB_URL = "https://dfphwmxczthwitzizczy.supabase.co";
        const SUB_KEY =  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmcGh3bXhjenRod2l0eml6Y3p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMDY1NTUsImV4cCI6MjA5MDY4MjU1NX0.cvU0kh_Y83ANGuBUrvCXVzycF-8YrM52tcSSJwFBYlo";
        const sbClient = supabase.createClient(SUB_URL, SUB_KEY);

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const pass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const submitBtn = e.target.querySelector('button');

            // 1. Basic Security Validation
            if (pass !== confirm) {
                return alert("❌ Passwords do not match!");
            }

            if (pass.length < 6) {
                return alert("⚠️ Password must be at least 6 characters long.");
            }

            // UI Feedback
            submitBtn.disabled = true;
            submitBtn.innerText = "Updating...";

            try {
                // 2. Execute Password Update
                const { error } = await sbClient.auth.updateUser({ password: pass });

                if (error) {
                    alert("Error: " + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Update Password";
                } else {
                    // 3. Success Feedback & Redirect
                    alert("✅ Password updated successfully! Redirecting to login page...");
                    
                    // Clear the recovery session
                    await sbClient.auth.signOut();
                    
                    // Send user to login
                    window.location.href = "admin-login.html";
                }
            } catch (err) {
                console.error("Critical Reset Error:", err);
                alert("An unexpected error occurred. Please refresh and try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Update Password";
            }
        });
    </script>
</body>
</html>
