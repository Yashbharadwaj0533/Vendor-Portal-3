<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Application Status - Innoworq</title>
    <style>
        :root {
            --primary: #0d6efd;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Navbar */
        .navbar { background: white; padding: 1rem 0; border-bottom: 1px solid var(--border); }
        .container { max-width: 600px; margin: 0 auto; padding: 0 1.5rem; }
        .nav-brand { font-weight: 800; color: var(--primary); text-decoration: none; font-size: 1.2rem; }

        /* Search Card */
        .status-card { background: var(--card); padding: 2.5rem; border-radius: 12px; shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-top: 4rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        
        .search-box { display: flex; flex-direction: column; gap: 1rem; }
        input { padding: 0.8rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        
        .btn-search { background: var(--primary); color: white; padding: 0.8rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-search:hover { opacity: 0.9; }

        /* Result Display */
        #resultArea { margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border); display: none; }
        .status-info { text-align: center; }
        .status-label { font-size: 0.9rem; color: #64748b; margin-bottom: 0.5rem; }
        .status-value { font-size: 1.4rem; font-weight: 700; text-transform: uppercase; }
        
        /* Status Colors */
        .status-pending { color: #b45309; }
        .status-approved { color: #15803d; }
        .status-rejected { color: #b91c1c; }

        .error-msg { color: #ef4444; text-align: center; font-size: 0.9rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">INNOWORQ</a>
        </div>
    </nav>

    <main class="container">
        <div class="status-card">
            <div class="header">
                <h1>Track Application</h1>
                <p>Enter your details to check registration status</p>
            </div>

            <div class="search-box">
                <input type="text" id="regNumber" placeholder="Enter Registration Number (PAN/GST)">
                <button class="btn-search" onclick="checkStatus()">Search Status</button>
            </div>

            <p id="errorMsg" class="error-msg">No application found with these details.</p>

            <div id="resultArea">
                <div class="status-info">
                    <p class="status-label">Current Status for <span id="displayCompany" style="color:var(--text); font-weight:600;"></span>:</p>
                    <div id="displayStatus" class="status-value"></div>
                    <p id="statusDesc" style="font-size: 0.85rem; color: #64748b; margin-top: 1rem;"></p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 2. Initialize Supabase
        const SUB_URL = "https://dfphwmxczthwitzizczy.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmcGh3bXhjenRod2l0eml6Y3p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMDY1NTUsImV4cCI6MjA5MDY4MjU1NX0.cvU0kh_Y83ANGuBUrvCXVzycF-8YrM52tcSSJwFBYlo";
        const sbClient = supabase.createClient(SUB_URL, SUB_KEY);

        async function checkStatus() {
            const regNumber = document.getElementById('regNumber').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const resultArea = document.getElementById('resultArea');
            const displayCompany = document.getElementById('displayCompany');
            const displayStatus = document.getElementById('displayStatus');
            const statusDesc = document.getElementById('statusDesc');

            if (!regNumber) {
                alert("Please enter your Registration Number (PAN/GST)");
                return;
            }

            // Reset UI
            errorMsg.style.display = 'none';
            resultArea.style.display = 'none';
            displayStatus.innerHTML = ''; // Clear previous results

            try {
                // 3. Search for ALL matching records
                const { data, error } = await sbClient
                    .from('vendors')
                    .select('company_name, status, vendor_type, created_at')
                    .or(`pan.eq.${regNumber},gstin.eq.${regNumber}`)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    errorMsg.style.display = 'block';
                    return;
                }

                // 4. Show Results
                displayCompany.innerText = data[0].company_name;
                resultArea.style.display = 'block';

                // 5. Loop through records and show different statuses for different types
                data.forEach(record => {
                    const type = record.vendor_type || 'General';
                    const status = record.status || 'Pending';
                    const statusClass = 'status-' + status.toLowerCase();
                    
                    const statusHtml = `
                        <div style="margin-bottom: 1.5rem; padding: 1.2rem; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc;">
                            <div style="font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 800; letter-spacing: 0.05em; margin-bottom: 4px;">
                                Registration Type: ${type}
                            </div>
                            <div class="status-value ${statusClass}" style="font-size: 1.3rem; margin-bottom: 8px;">
                                ${status}
                            </div>
                            <div style="font-size: 0.8rem; color: #94a3b8;">
                                Application Date: ${new Date(record.created_at).toLocaleDateString()}
                            </div>
                        </div>
                    `;
                    displayStatus.insertAdjacentHTML('beforeend', statusHtml);
                });

                statusDesc.innerText = "If you have multiple registrations, they are listed above.";

            } catch (err) {
                console.error("Search Error:", err);
                alert("An error occurred while fetching status. Check console for details.");
            }
        } // End of checkStatus function
    </script>
</body>

</html>
